<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" font-family="'Segoe UI', Arial, sans-serif">

  <!-- Title -->
  <text x="410" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a237e">
    RA &#183; M3 Vanilla GP Formula &#183; AUC-PR 0.0305 (4 features)
  </text>

  <!-- Formula box -->
  <rect x="50" y="48" width="720" height="200" rx="14" fill="#e8eef8" stroke="#1565c0" stroke-width="2.5"/>

  <!-- Numerator line 1: hct · neut⁵ · L -->
  <text text-anchor="middle" font-size="15" font-family="'Courier New', Courier, monospace">
    <tspan x="410" y="100" fill="#1565c0">hct</tspan>
    <tspan fill="#1a237e"> &#183; </tspan>
    <tspan fill="#c65c00">neut</tspan>
    <tspan fill="#c65c00" font-size="10" dy="-5">5</tspan>
    <tspan fill="#1a237e" dy="5"> &#183; </tspan>
    <tspan fill="#555555" font-style="italic">L</tspan>
  </text>

  <!-- Numerator line 2: + mono³ · (√mono + L) · [mono⁸ · (√mono + L) · (mono³ + neut) + neut⁴] -->
  <text text-anchor="middle" font-size="15" font-family="'Courier New', Courier, monospace">
    <tspan x="410" y="132" fill="#1a237e">+ </tspan>
    <tspan fill="#2e7d32">mono</tspan>
    <tspan fill="#2e7d32" font-size="10" dy="-5">3</tspan>
    <tspan fill="#1a237e" dy="5"> &#183; (&#8730;</tspan>
    <tspan fill="#2e7d32">mono</tspan>
    <tspan fill="#1a237e"> + </tspan>
    <tspan fill="#555555" font-style="italic">L</tspan>
    <tspan fill="#1a237e">) &#183; [</tspan>
    <tspan fill="#2e7d32">mono</tspan>
    <tspan fill="#2e7d32" font-size="10" dy="-5">8</tspan>
    <tspan fill="#1a237e" dy="5"> &#183; (&#8730;</tspan>
    <tspan fill="#2e7d32">mono</tspan>
    <tspan fill="#1a237e"> + </tspan>
    <tspan fill="#555555" font-style="italic">L</tspan>
    <tspan fill="#1a237e">) &#183; (</tspan>
    <tspan fill="#2e7d32">mono</tspan>
    <tspan fill="#2e7d32" font-size="10" dy="-5">3</tspan>
    <tspan fill="#1a237e" dy="5"> + </tspan>
    <tspan fill="#c65c00">neut</tspan>
    <tspan fill="#1a237e">) + </tspan>
    <tspan fill="#c65c00">neut</tspan>
    <tspan fill="#c65c00" font-size="10" dy="-5">4</tspan>
    <tspan fill="#1a237e" dy="5">]</tspan>
  </text>

  <!-- Fraction line -->
  <line x1="100" y1="152" x2="720" y2="152" stroke="#1565c0" stroke-width="2"/>

  <!-- Denominator: hct · neut⁵ -->
  <text text-anchor="middle" font-size="15" font-family="'Courier New', Courier, monospace">
    <tspan x="410" y="190" fill="#1565c0">hct</tspan>
    <tspan fill="#1a237e"> &#183; </tspan>
    <tspan fill="#c65c00">neut</tspan>
    <tspan fill="#c65c00" font-size="10" dy="-5">5</tspan>
  </text>

  <!-- Legend -->
  <text text-anchor="middle" font-size="13" font-family="'Courier New', Courier, monospace">
    <tspan x="410" y="268" fill="#555555">where  </tspan>
    <tspan fill="#555555" font-style="italic">L</tspan>
    <tspan fill="#555555"> = log(</tspan>
    <tspan fill="#1565c0">hct</tspan>
    <tspan fill="#555555"> &#8722; </tspan>
    <tspan fill="#6a1b9a">mchc</tspan>
    <tspan fill="#555555">)     |     </tspan>
    <tspan fill="#2e7d32">mono</tspan>
    <tspan fill="#555555"> = mono_pct     </tspan>
    <tspan fill="#c65c00">neut</tspan>
    <tspan fill="#555555"> = neut_pct</tspan>
  </text>

</svg>
